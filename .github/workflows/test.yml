name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Deliberately NOT running `patchright install chromium`. Every test stubs
      # the browser session, so downloading ~150MB of Chromium would add minutes
      # to each run and prove nothing. If a test ever needs a real browser it
      # belongs behind an opt-in env flag, not in the default CI path.
      #
      # LINKEDIN_COOKIE is likewise never set here: no test may touch a real
      # LinkedIn account, and a missing cookie is the mechanism that guarantees it.
      - name: Run tests
        run: uv run pytest -v
