<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">linkedin-api-mcp</title>
  <desc id="d">A terminal shows two questions. "who do I know at SGX?" is answered by the curated search_people tool, listing three matches: Alex Tan, Priya Nair, Wei Jian Lim. "message basil" triggers send_message, which queues under a one action at a time rate limit, then get_inbox reads the thread back to confirm delivery before reporting success. 14 tools, 68 tests, MIT licence.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .dim  { fill: #7d8590; }
    .fg   { fill: #e6edf3; }
    .acc  { fill: #2f81f7; }
    .ok   { fill: #3fb950; }
    .warn { fill: #d29922; }
    .edge { stroke: #30363d; stroke-width: 1; fill: none; }

    /* One 15s timeline. Lines fade IN staggered but ALL fade OUT together at 94%,
       so the loop never shows a half-assembled state. */
    g[class^="ln"] { opacity: 0; }
    .ln1 { animation: k1 15s infinite }
    .ln2 { animation: k2 15s infinite }
    .ln3 { animation: k3 15s infinite }
    .ln4 { animation: k4 15s infinite }
    .ln5 { animation: k5 15s infinite }
    .ln6 { animation: k6 15s infinite }
    .ln7 { animation: k7 15s infinite }
    .ln8 { animation: k8 15s infinite }

    @keyframes k1 { 0%,1% {opacity:0} 3%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k2 { 0%,8% {opacity:0} 10%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k3 { 0%,13% {opacity:0} 15%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k4 { 0%,26% {opacity:0} 28%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k5 { 0%,34% {opacity:0} 36%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k6 { 0%,41% {opacity:0} 43%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k7 { 0%,48% {opacity:0} 50%,94% {opacity:1} 97%,100% {opacity:0} }
    @keyframes k8 { 0%,56% {opacity:0} 58%,94% {opacity:1} 97%,100% {opacity:0} }

    .caret { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      g[class^="ln"] { opacity: 1; animation: none }
      .caret { animation: none; opacity: 0 }
    }
  </style>

  <rect fill="#0d1117" x="0.5" y="0.5" width="839" height="299" rx="10"/>
  <rect fill="#161b22" x="0.5" y="0.5" width="839" height="34" rx="10"/>
  <rect fill="#161b22" x="0.5" y="24" width="839" height="12"/>
  <rect class="edge" x="0.5" y="0.5" width="839" height="299" rx="10"/>
  <line class="edge" x1="0.5" y1="35" x2="839.5" y2="35"/>
  <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="18" r="5.5" fill="#28c840"/>
  <text class="mono dim" x="420" y="22" font-size="12" text-anchor="middle">linkedin-api-mcp</text>

  <!-- beat 1: curated fast path -->
  <g class="ln1">
    <text class="mono ok" x="28" y="72" font-size="15">❯</text>
    <text class="mono fg" x="50" y="72" font-size="15">who do I know at SGX?</text>
  </g>
  <g class="ln2">
    <text class="mono acc" x="50" y="98" font-size="13">search_people("SGX")</text>
    <text class="mono dim" x="234" y="98" font-size="13">curated tool, one call, no lookup</text>
  </g>
  <g class="ln3">
    <text class="mono fg"  x="70" y="121" font-size="13">Alex Tan</text>
    <text class="mono dim" x="148" y="121" font-size="13">·</text>
    <text class="mono fg"  x="164" y="121" font-size="13">Priya Nair</text>
    <text class="mono dim" x="258" y="121" font-size="13">·</text>
    <text class="mono fg"  x="274" y="121" font-size="13">Wei Jian Lim</text>
  </g>

  <!-- beat 2: send, then verify -->
  <g class="ln4">
    <text class="mono ok" x="28" y="166" font-size="15">❯</text>
    <text class="mono fg" x="50" y="166" font-size="15">message basil</text>
    <rect class="caret" x="184" y="153" width="8" height="17" fill="#e6edf3"/>
  </g>
  <g class="ln5">
    <text class="mono warn" x="50" y="190" font-size="12">one action at a time, 2s floor before it sends…</text>
  </g>
  <g class="ln6">
    <text class="mono acc" x="50"  y="214" font-size="13">send_message</text>
    <text class="mono dim" x="160" y="214" font-size="13">→</text>
    <text class="mono ok"  x="184" y="214" font-size="13">sent</text>
    <text class="mono dim" x="230" y="214" font-size="13">to basil: "congrats on the offer"</text>
  </g>
  <g class="ln7">
    <text class="mono acc" x="50"  y="237" font-size="13">get_inbox</text>
    <text class="mono dim" x="136" y="237" font-size="13">→</text>
    <text class="mono ok"  x="160" y="237" font-size="13">confirmed</text>
    <text class="mono dim" x="246" y="237" font-size="13">reads the thread back before reporting success</text>
  </g>

  <g class="ln8">
    <line class="edge" x1="28" y1="260" x2="812" y2="260"/>
    <text class="mono dim" x="28"  y="281" font-size="12">14 tools</text>
    <text class="mono dim" x="100" y="281" font-size="12">·</text>
    <text class="mono dim" x="116" y="281" font-size="12">68 tests</text>
    <text class="mono dim" x="190" y="281" font-size="12">·</text>
    <text class="mono dim" x="206" y="281" font-size="12">MIT</text>
    <text class="mono dim" x="812" y="281" font-size="12" text-anchor="end">uvx linkedin-api-mcp</text>
  </g>
</svg>
